name: Actualizar CRM Solicitudes
on:
  schedule:
    # Corrida COMPLETA una vez al dia de madrugada (06:23 UTC = 2:23 a.m. Venezuela): incluye el rastreo
    # de solicitudes fusionadas y los perdidos del CRM (consultas pesadas), fuera del horario laboral
    - cron: '23 6 * * *'
    # Corrida LIGERA cada hora de 06:50 a 19:50 (Venezuela): solo las solicitudes del formulario
    # (sin rastreo ni perdidos del CRM). Va 10 min antes de la actualizacion del tablero de gestion.
    - cron: '50 10-23 * * *'
  workflow_dispatch:
    inputs:
      completo:
        description: 'Corrida completa (con rastreo y perdidos del CRM: consultas pesadas a Odoo)'
        type: boolean
        default: false
concurrency:
  group: crm-solicitudes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip requests
      # Telefonos/emails para el rastreo: viven solo en la cache privada de Actions, nunca en el repo
      - name: Restaurar contactos privados
        uses: actions/cache/restore@v4
        with:
          path: privado
          key: privado-${{ github.run_id }}
          restore-keys: privado-
      - name: Generar
        env:
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_PASS: ${{ secrets.ODOO_PASS }}
          FECHA_CORTE: '2026-10-22'
          # Seccion Flujo en pausa (consulta pesada) mientras Odoo se estabiliza; '1' la reactiva
          FLUJO_ACTIVO: '0'
          # Ligera salvo la corrida nocturna o una manual marcada "completo"
          LIGERO: ${{ (github.event.schedule == '23 6 * * *' || inputs.completo) && '0' || '1' }}
        run: python generar.py
      - name: Guardar contactos privados
        uses: actions/cache/save@v4
        with:
          path: privado
          key: privado-${{ github.run_id }}
      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Actualizado $(date -u '+%Y-%m-%d %H:%M UTC')"; git pull --rebase -q origin main; git push; fi
